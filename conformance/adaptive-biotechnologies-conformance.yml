# Adaptive Biotechnologies — standards + compliance conformance
generated: '2026-09-07'
method: searched
source: https://www.adaptivebiotech.com/licenses-and-accreditation/
note: >-
  Adaptive Biotechnologies publishes no machine-readable API contract, so nothing here is derived
  from a specification. Every entry below is read from a page the company publishes. The
  laboratory and quality-system credentials are real and named on the Licenses & Accreditation
  page; the healthcare interoperability standards are recorded as NOT declared because Adaptive's
  own public pages — including the clonoSEQ EMR integration page — name integration partners
  (Epic, Epic Aura, Flatiron OncoEMR, Carequality) but never name HL7 v2, FHIR, C-CDA or any
  other interchange standard. That is an honest absence of a public declaration, not evidence
  that the underlying interfaces do not use those standards.
