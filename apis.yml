aid: adaptive-biotechnologies
name: Adaptive Biotechnologies
description: >-
  Adaptive Biotechnologies Corporation (Nasdaq: ADPT) is a Seattle, Washington immune-medicine
  company that reads and translates the adaptive immune system at scale. Founded in 2009 by
  brothers Chad Robins and Harlan Robins as Adaptive TCR Corporation, it built an
  immunosequencing platform that amplifies and sequences rearranged T-cell and B-cell receptor
  genes, then applies computational models to turn that receptor repertoire into clinical and
  research data. Its lead commercial product is clonoSEQ, an FDA-cleared next-generation
  sequencing assay for measurable residual disease (MRD) in multiple myeloma, B-cell acute
  lymphoblastic leukemia, chronic lymphocytic leukemia, mantle cell lymphoma and diffuse large
  B-cell lymphoma, run out of its CLIA-certified, CAP-accredited Seattle laboratory. It also
  sells immunoSEQ research assays with the cloud-based immunoSEQ Analyzer and the immuneACCESS
  public data repository, and MRD biopharma services to drug developers. Adaptive is a
  diagnostics and services company, not a software vendor: it publishes no developer portal, no
  public API reference and no machine-readable specification. Its integration surface is
  clinician-facing and delivered bilaterally — clonoSEQ orders and results flow through Epic
  (including Epic Aura), Flatiron Health's OncoEMR via Molecular Profiling Integration, and
  Carequality/health information exchanges, arranged through its EMR integration specialists
  rather than through self-serve documentation.
